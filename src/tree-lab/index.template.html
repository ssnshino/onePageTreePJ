<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OLD OAK TREE LAB</title><style>/*__INLINE_CSS__*/</style></head><body>
<div id="app"><div id="stage"></div>
<section class="panel"><h1>OLD OAK <b>TREE LAB</b></h1><div class="sub">木だけを白日の下でモミモミする。Weber–Penn / White Oak morphology / branch collar / trimmed foliage cards.</div>
<div class="grid"><div class="ctrl"><label><span>SEED</span><b data-value="seed">187</b></label><input id="seed" type="range" min="1" max="999" step="1" value="187"></div>
<div class="ctrl"><label><span>HEIGHT</span><b data-value="height">12.5</b></label><input id="height" type="range" min="8" max="18" step="0.25" value="12.5"></div>
<div class="ctrl"><label><span>TRUNK RADIUS</span><b data-value="radius">0.74</b></label><input id="radius" type="range" min="0.4" max="1.25" step="0.02" value="0.74"></div>
<div class="ctrl"><label><span>ROOT FLARE</span><b data-value="flare">0.82</b></label><input id="flare" type="range" min="0" max="1.5" step="0.02" value="0.82"></div>
<div class="ctrl"><label><span>JUNCTION COLLAR</span><b data-value="collar">0.24</b></label><input id="collar" type="range" min="0" max="0.65" step="0.01" value="0.24"></div>
<div class="ctrl"><label><span>PRIMARY COUNT</span><b data-value="branches">7</b></label><input id="branches" type="range" min="3" max="14" step="1" value="7"></div>
<div class="ctrl"><label><span>PRIMARY ANGLE</span><b data-value="angle">68</b></label><input id="angle" type="range" min="40" max="88" step="1" value="68"></div>
<div class="ctrl"><label><span>L1 GNARL</span><b data-value="gnarl1">0.095</b></label><input id="gnarl1" type="range" min="0.01" max="0.24" step="0.005" value="0.095"></div>
<div class="ctrl"><label><span>L2 GNARL</span><b data-value="gnarl2">0.18</b></label><input id="gnarl2" type="range" min="0.02" max="0.34" step="0.005" value="0.18"></div>
<div class="ctrl"><label><span>TIP UP-PULL</span><b data-value="upPull">0.12</b></label><input id="upPull" type="range" min="0" max="0.38" step="0.01" value="0.12"></div>
<div class="ctrl"><label><span>LEAVES / TWIG</span><b data-value="leafCount">9</b></label><input id="leafCount" type="range" min="2" max="18" step="1" value="9"></div>
<div class="ctrl"><label><span>LEAF SIZE</span><b data-value="leafSize">0.48</b></label><input id="leafSize" type="range" min="0.2" max="0.9" step="0.02" value="0.48"></div></div>
<div class="buttons"><button id="three">3/4</button><button id="front">FRONT</button><button id="side">SIDE</button><button id="top">TOP</button></div>
<div class="buttons"><button id="random">RANDOM</button><button id="silhouette">SILHOUETTE</button><button id="wire">WIREFRAME</button><button id="leaves">LEAVES</button></div>
<div class="buttons"><button id="roots">ROOTS</button></div>
</section>
<div class="stats"><div><b>TREE</b> <span id="treeStats">--</span></div><div id="renderStats" class="ok">FPS --</div></div>
</div><script>/*__INLINE_JS__*/</script></body></html>
